    <path d="M188 262l-30 50 20 4 22-40 22 40 20-4-30-50z" fill="#1A1033" stroke-width="7"/>
    <rect x="184" y="254" width="32" height="32" rx="8" fill="#1A1033" stroke-width="7"/>
