<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 440" role="img" aria-label="Legends Club crest">
  <defs>
    <linearGradient id="lcShield" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9A5CFF"/><stop offset="1" stop-color="#5B22B8"/></linearGradient>
    <linearGradient id="lcStar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE36B"/><stop offset=".55" stop-color="#FFC21F"/><stop offset="1" stop-color="#FF8A2B"/></linearGradient>
    <linearGradient id="lcRib" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF6FB6"/><stop offset="1" stop-color="#E43A8C"/></linearGradient>
    <linearGradient id="lcGold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE36B"/><stop offset="1" stop-color="#F5B82E"/></linearGradient>
  </defs>
  <g stroke="#3A1A6B" stroke-linejoin="round" stroke-linecap="round">
    <!-- side sparkles -->
    <path d="M38 150c3 18 9 24 27 27-18 3-24 9-27 27-3-18-9-24-27-27 18-3 24-9 27-27z" fill="#3EC6F2" stroke-width="6"/>
