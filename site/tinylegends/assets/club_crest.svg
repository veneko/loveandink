    <path d="M200 116l22 46 50 6-37 34 10 50-45-25-45 25 10-50-37-34 50-6z" fill="url(#lcStar)" stroke-width="10"/>
    <path d="M206 134l9 19" stroke="#FFF6C9" stroke-width="6" fill="none"/>
