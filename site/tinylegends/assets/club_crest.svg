  <text x="200" y="353" text-anchor="middle" font-family="Fredoka, 'Arial Rounded MT Bold', sans-serif" font-weight="700" font-size="33" fill="#fff" stroke="#3A1A6B" stroke-width="7" paint-order="stroke" letter-spacing="1">LEGENDS CLUB</text>
  <text x="200" y="208" text-anchor="middle" font-family="Fredoka, 'Arial Rounded MT Bold', sans-serif" font-weight="700" font-size="34" fill="#fff" stroke="#3A1A6B" stroke-width="8" paint-order="stroke">TL</text>
  <text x="200" y="406" text-anchor="middle" font-family="Fredoka, 'Arial Rounded MT Bold', sans-serif" font-weight="700" font-size="20" fill="#3A1A6B" letter-spacing="5">EST · 2026</text>
