    <path d="M136 72l14-48 30 30 20-40 20 40 30-30 14 48c-42 10-86 10-128 0z" fill="url(#lcGold)" stroke-width="10"/>
    <circle cx="150" cy="22" r="8" fill="#FF4FA3" stroke-width="6"/><circle cx="200" cy="12" r="9" fill="#3EC6F2" stroke-width="6"/><circle cx="250" cy="22" r="8" fill="#FF4FA3" stroke-width="6"/>
    <!-- ribbon -->
    <path d="M40 330l40-10 6 50-40 14 14-28z" fill="#C42A76" stroke-width="9"/>
    <path d="M360 330l-40-10-6 50 40 14-14-28z" fill="#C42A76" stroke-width="9"/>
