    <path d="M200 70c40 18 84 24 122 22 4 104-22 196-122 254C100 288 74 196 78 92c38 2 82-4 122-22z" fill="url(#lcShield)" stroke-width="12"/>
    <path d="M200 92c34 14 70 20 102 20 1 88-21 166-102 214-81-48-103-126-102-214 32 0 68-6 102-20z" fill="none" stroke="#FFD23F" stroke-width="5" stroke-dasharray="2 12"/>
